services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "${COOKIE_SAME_SITE:-lax}"
      DEV_LOGIN_ENABLED: "false"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      MICROSOFT_SSO_ENABLED: "${MICROSOFT_SSO_ENABLED:?MICROSOFT_SSO_ENABLED is required}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:?MICROSOFT_CLIENT_ID is required}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:?MICROSOFT_CLIENT_SECRET is required}"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID:?MICROSOFT_TENANT_ID is required}"
      MICROSOFT_ALLOWED_TENANT_IDS: "${MICROSOFT_ALLOWED_TENANT_IDS:?MICROSOFT_ALLOWED_TENANT_IDS is required}"
      MICROSOFT_ALLOWED_DOMAINS: "${MICROSOFT_ALLOWED_DOMAINS:?MICROSOFT_ALLOWED_DOMAINS is required}"
      MICROSOFT_REDIRECT_URI: "${MICROSOFT_REDIRECT_URI:?MICROSOFT_REDIRECT_URI is required}"
      MICROSOFT_POST_LOGOUT_REDIRECT_URI: "${MICROSOFT_POST_LOGOUT_REDIRECT_URI:?MICROSOFT_POST_LOGOUT_REDIRECT_URI is required}"
      MICROSOFT_SSO_AUTO_LINK_BY_EMAIL: "${MICROSOFT_SSO_AUTO_LINK_BY_EMAIL:-false}"
      MICROSOFT_SSO_AUTO_PROVISION_ENABLED: "${MICROSOFT_SSO_AUTO_PROVISION_ENABLED:-false}"
      RUNTIME_PROVIDER: "${RUNTIME_PROVIDER:-local}"
      RUNTIME_ALLOW_PROVIDER_FALLBACK: "false"
      RUNTIME_ALLOW_EXTERNAL_TOOLS: "${RUNTIME_ALLOW_EXTERNAL_TOOLS:-false}"
      RUNTIME_ADAPTER_ENABLED: "${RUNTIME_ADAPTER_ENABLED:-false}"
      AGNO_RUNTIME_HTTP_ENABLED: "${AGNO_RUNTIME_HTTP_ENABLED:-false}"
      AGNO_RUNTIME_HTTP_BASE_URL: "http://agno-bridge:8091"
      AGNO_RUNTIME_HTTP_REQUIRE_SECURITY_KEY: "true"
      AGNO_RUNTIME_HTTP_SECURITY_KEY: "${AGNO_RUNTIME_HTTP_SECURITY_KEY:?AGNO_RUNTIME_HTTP_SECURITY_KEY is required}"
      AGNO_RUNTIME_HTTP_TOOLS_ENABLED: "${AGNO_RUNTIME_HTTP_TOOLS_ENABLED:-false}"
      AGNO_RUNTIME_HTTP_MAX_TOOL_CALLS: "${AGNO_RUNTIME_HTTP_MAX_TOOL_CALLS:-0}"
      AGNO_RUNTIME_HTTP_TOOL_GATEWAY_ENABLED: "${AGNO_RUNTIME_HTTP_TOOL_GATEWAY_ENABLED:-false}"
      AGNO_ENABLED: "false"
      AGNO_EXECUTION_ENABLED: "false"
      AGNO_HEALTHCHECK_ENABLED: "false"
      AGNO_ALLOW_EXTERNAL_TOOLS: "false"
      AGNO_ALLOW_REMOTE_MCP: "false"
      MCP_REMOTE_ENABLED: "${MCP_REMOTE_ENABLED:-false}"
      MCP_REMOTE_DISCOVERY_ENABLED: "${MCP_REMOTE_DISCOVERY_ENABLED:-false}"
      MCP_REMOTE_EXECUTION_ENABLED: "${MCP_REMOTE_EXECUTION_ENABLED:-false}"
      MCP_REMOTE_READONLY_ENABLED: "${MCP_REMOTE_READONLY_ENABLED:-false}"
      MCP_REMOTE_EGRESS_ALLOWLIST: "${MCP_REMOTE_EGRESS_ALLOWLIST:-}"
      MCP_REMOTE_REQUIRE_SECRET_REF: "true"
      MCP_REMOTE_ALLOW_WRITE_TOOLS: "false"
      MCP_CORPORATE_READONLY_ENABLED: "${MCP_CORPORATE_READONLY_ENABLED:-false}"
      MCP_CORPORATE_READONLY_ALLOWED_ORIGIN: "${MCP_CORPORATE_READONLY_ALLOWED_ORIGIN:-}"
      MCP_CORPORATE_READONLY_TARGET_ENABLED: "${MCP_CORPORATE_READONLY_TARGET_ENABLED:-false}"
      ORCHESTRA_CORPORATE_READONLY_STATUS_TOKEN: "${ORCHESTRA_CORPORATE_READONLY_STATUS_TOKEN:-}"
      LLM_PROVIDERS_ENABLED: "false"
      LLM_EXECUTION_ENABLED: "false"
      OPENAI_ENABLED: "false"
      OPENAI_EXECUTION_ENABLED: "false"
      AZURE_OPENAI_ENABLED: "false"
      AZURE_OPENAI_EXECUTION_ENABLED: "false"
      ANTHROPIC_ENABLED: "false"
      ANTHROPIC_EXECUTION_ENABLED: "false"
      EMBEDDINGS_ENABLED: "false"
      EMBEDDINGS_EXECUTION_ENABLED: "false"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agno-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_ENV: "homologation"
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}"
        VITE_USE_MOCKS: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  agno-bridge:
    build:
      context: ./runtime/agno-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AGNO_BRIDGE_EXECUTION_MODE: "${AGNO_BRIDGE_EXECUTION_MODE:-offline}"
      AGNO_BRIDGE_PROVIDER: "${AGNO_BRIDGE_PROVIDER:-openai}"
      AGNO_BRIDGE_MODEL_DISCOVERY: "${AGNO_BRIDGE_MODEL_DISCOVERY:-static}"
      AGNO_BRIDGE_ALLOWED_MODELS: "${AGNO_BRIDGE_ALLOWED_MODELS:-}"
      AGNO_BRIDGE_DEFAULT_MODEL: "${AGNO_BRIDGE_DEFAULT_MODEL:-gpt-4o-mini}"
      AGNO_BRIDGE_MODEL_DISCOVERY_CACHE_TTL_SECONDS: "${AGNO_BRIDGE_MODEL_DISCOVERY_CACHE_TTL_SECONDS:-600}"
      AGNO_BRIDGE_MODEL_DISCOVERY_TIMEOUT_MS: "${AGNO_BRIDGE_MODEL_DISCOVERY_TIMEOUT_MS:-5000}"
      # HML provider credential is mounted exclusively into this service.
      OPENAI_API_KEY_FILE: "/run/secrets/openai_api_key"
      AGNO_RUNTIME_HTTP_HOST: "0.0.0.0"
      AGNO_RUNTIME_HTTP_PORT: "8091"
      AGNO_RUNTIME_HTTP_REQUIRE_SECURITY_KEY: "true"
      AGNO_RUNTIME_HTTP_SECURITY_KEY: "${AGNO_RUNTIME_HTTP_SECURITY_KEY:?AGNO_RUNTIME_HTTP_SECURITY_KEY is required}"
      AGNO_RUNTIME_HTTP_RAG_CONTEXT_ENABLED: "false"
      AGNO_RUNTIME_HTTP_TOOLS_ENABLED: "${AGNO_RUNTIME_HTTP_TOOLS_ENABLED:-false}"
      AGNO_RUNTIME_HTTP_MAX_TOOL_CALLS: "${AGNO_RUNTIME_HTTP_MAX_TOOL_CALLS:-0}"
      AGNO_RUNTIME_HTTP_TOOL_GATEWAY_ENABLED: "${AGNO_RUNTIME_HTTP_TOOL_GATEWAY_ENABLED:-false}"
      ORCHESTRA_TOOL_GATEWAY_URL: "http://backend:3000/api/v1/runtime/agno/tool-calls"
    volumes:
      - type: bind
        source: /etc/orchestra/secrets/hml/openai_api_key
        target: /run/secrets/openai_api_key
        read_only: true
    expose:
      - "8091"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "healthcheck.py"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: operations
    restart: "no"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - orchestra_hml_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  orchestra_hml_db_data:
