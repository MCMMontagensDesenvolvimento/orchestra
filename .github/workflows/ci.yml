name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma Client
        run: npm --prefix backend run prisma:generate

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Test governed runtime and production secrets
        run: >-
          npm --prefix backend run test --
          tests/api/agent-runs.test.ts
          tests/api/runtime-observability.test.ts
          tests/unit/ai-observability.test.ts
          tests/unit/runtime-assistant-spec-builder.test.ts
          tests/unit/production-secrets.test.ts
          tests/unit/corporate-readonly-transport.test.ts
          tests/api/status.test.ts
          --run

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run 16S quality and security eval gates
        run: scripts/evals-runtime-qualidade-16s.sh --dry-run

      - name: Run 16U supervised homologation static gates
        run: |
          scripts/preflight-conector-readonly-16u.sh --dry-run
          scripts/smoke-homologacao-conector-readonly-16u.sh --dry-run

      - name: Run 16V read-only status endpoint static gate
        run: scripts/smoke-endpoint-status-readonly-16v.sh --dry-run

      - name: Run 16W first-tool static gate
        run: scripts/smoke-primeira-tool-status-16w.sh --dry-run

      - name: Run 16X status-contract alignment static gate
        run: scripts/smoke-alinhamento-tool-status-16x.sh --dry-run

      - name: Run 16Y HTTPS readiness static gate
        run: scripts/smoke-readiness-https-tool-status-16y.sh --dry-run

      - name: Run 16Z HTTPS publication preparation static gate
        run: scripts/smoke-publicacao-https-16z.sh --dry-run

      - name: Run 17A homologated HTTPS plan static gate
        run: scripts/smoke-plano-deploy-17a.sh --dry-run

      - name: Run 17B production artifact hardening static gate
        run: scripts/smoke-hardening-compose-nginx-17b.sh --dry-run

      - name: Run 17C secrets and production variables inventory static gate
        run: scripts/smoke-secrets-variaveis-17c.sh --dry-run

      - name: Run 17D homologable release preflight static gate
        run: scripts/smoke-release-homologavel-17d.sh --dry-run

      - name: Run 18A local UI homologation preparation static gate
        run: scripts/smoke-homologacao-ui-18a.sh --dry-run

      - name: Run 18C Assistant Wizard correction static gate
        run: scripts/smoke-correcao-wizard-assistants-18c.sh --dry-run

      - name: Run 18D governed local MCP/tools static gate
        run: scripts/smoke-mcp-tools-governado-local-18d.sh --dry-run

      - name: Run static production preflight
        run: scripts/preflight-prod-runtime-16o.sh --dry-run

      - name: Run runtime smoke suite
        run: |
          scripts/smoke-e2e-chat-rag-mcp-16r.sh --dry-run
          scripts/smoke-hardening-producao-runtime-16o.sh --dry-run
          scripts/smoke-custos-quotas-runtime-16n.sh --dry-run
          scripts/smoke-observabilidade-runtime-16m.sh --dry-run
          scripts/smoke-chat-rag-operacional-16k.sh --dry-run
          scripts/smoke-knowledge-rag-16i.sh --dry-run
