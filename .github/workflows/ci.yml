name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma Client
        run: npm --prefix backend run prisma:generate

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Test governed runtime and production secrets
        run: >-
          npm --prefix backend run test --
          tests/api/agent-runs.test.ts
          tests/api/runtime-observability.test.ts
          tests/unit/ai-observability.test.ts
          tests/unit/runtime-assistant-spec-builder.test.ts
          tests/unit/production-secrets.test.ts
          --run

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run static production preflight
        run: scripts/preflight-prod-runtime-16o.sh --dry-run

      - name: Run runtime smoke suite
        run: |
          scripts/smoke-e2e-chat-rag-mcp-16r.sh --dry-run
          scripts/smoke-hardening-producao-runtime-16o.sh --dry-run
          scripts/smoke-custos-quotas-runtime-16n.sh --dry-run
          scripts/smoke-observabilidade-runtime-16m.sh --dry-run
          scripts/smoke-chat-rag-operacional-16k.sh --dry-run
          scripts/smoke-knowledge-rag-16i.sh --dry-run
