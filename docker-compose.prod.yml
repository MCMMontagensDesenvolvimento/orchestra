services:
  frontend:
    image: "${ORCHESTRA_FRONTEND_IMAGE:-orchestra-frontend:local}"
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_NAME: Orchestra
        VITE_APP_ENV: production
        VITE_API_BASE_URL: /api/v1
        VITE_USE_MOCKS: "false"
        VITE_MOCK_DELAY_MS: "0"
        VITE_MOCK_SCENARIO: success
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backend:
    image: "${ORCHESTRA_BACKEND_IMAGE:-orchestra-backend:local}"
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be supplied by the deployment environment}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be supplied by the deployment environment}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      COOKIE_SECURE: "true"
      DEV_LOGIN_ENABLED: "false"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RUNTIME_PROVIDER: "${RUNTIME_PROVIDER:-local}"
      RUNTIME_ALLOW_PROVIDER_FALLBACK: "false"
      RUNTIME_ALLOW_EXTERNAL_TOOLS: "false"
      AGNO_RUNTIME_HTTP_ENABLED: "${AGNO_RUNTIME_HTTP_ENABLED:-false}"
      AGNO_RUNTIME_HTTP_BASE_URL: "http://agno-bridge:8091"
      AGNO_RUNTIME_HTTP_REQUIRE_SECURITY_KEY: "true"
      AGNO_RUNTIME_HTTP_SECURITY_KEY: "${AGNO_RUNTIME_HTTP_SECURITY_KEY:-}"
      AGNO_RUNTIME_HTTP_TOOLS_ENABLED: "false"
      AGNO_RUNTIME_HTTP_MAX_TOOL_CALLS: "0"
      AGNO_RUNTIME_HTTP_TOOL_GATEWAY_ENABLED: "false"
      MCP_REMOTE_ENABLED: "false"
      MCP_REMOTE_EXECUTION_ENABLED: "false"
      MCP_REMOTE_DISCOVERY_ENABLED: "false"
      MCP_REMOTE_READONLY_ENABLED: "false"
      MCP_REMOTE_EGRESS_ALLOWLIST: ""
      MCP_REMOTE_MAX_TIMEOUT_MS: "5000"
      MCP_REMOTE_MAX_RESPONSE_BYTES: "65536"
      MCP_REMOTE_REQUIRE_SECRET_REF: "true"
      MCP_REMOTE_ALLOW_WRITE_TOOLS: "false"
      MCP_REMOTE_ALLOW_INSECURE_LOCAL_DEMO: "false"
      MCP_REMOTE_LOCAL_DEMO_ORIGIN: ""
      LLM_DEFAULT_PROVIDER: local_deterministic
      LLM_EXECUTION_ENABLED: "false"
      OPENAI_ENABLED: "false"
      OPENAI_EXECUTION_ENABLED: "false"
      AZURE_OPENAI_ENABLED: "false"
      AZURE_OPENAI_EXECUTION_ENABLED: "false"
      ANTHROPIC_ENABLED: "false"
      ANTHROPIC_EXECUTION_ENABLED: "false"
      EMBEDDINGS_ENABLED: "false"
      EMBEDDINGS_EXECUTION_ENABLED: "false"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.3-pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-orchestra}"
      POSTGRES_USER: "${POSTGRES_USER:-orchestra}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied by the deployment environment}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  agno-bridge:
    profiles: ["agno"]
    image: "${ORCHESTRA_AGNO_BRIDGE_IMAGE:-orchestra-agno-bridge:local}"
    build:
      context: ./runtime/agno-bridge
      dockerfile: Dockerfile
    env_file:
      - path: ./runtime/agno-bridge/.env
        required: false
    environment:
      AGNO_BRIDGE_EXECUTION_MODE: "${AGNO_BRIDGE_EXECUTION_MODE:-stub}"
      AGNO_BRIDGE_PROVIDER: "${AGNO_BRIDGE_PROVIDER:-stub}"
      AGNO_BRIDGE_ALLOWED_MODELS: "${AGNO_BRIDGE_ALLOWED_MODELS:-}"
      AGNO_RUNTIME_HTTP_HOST: 0.0.0.0
      AGNO_RUNTIME_HTTP_PORT: "8091"
      AGNO_RUNTIME_HTTP_REQUIRE_SECURITY_KEY: "true"
      AGNO_RUNTIME_HTTP_SECURITY_KEY: "${AGNO_RUNTIME_HTTP_SECURITY_KEY:-}"
      AGNO_RUNTIME_HTTP_RAG_CONTEXT_ENABLED: "false"
      AGNO_RUNTIME_HTTP_TOOLS_ENABLED: "false"
      AGNO_RUNTIME_HTTP_MAX_TOOL_CALLS: "0"
      AGNO_RUNTIME_HTTP_TOOL_GATEWAY_ENABLED: "false"
      ORCHESTRA_TOOL_GATEWAY_URL: ""
      AGNO_TELEMETRY: "false"
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped

  migrate:
    profiles: ["operations"]
    image: "${ORCHESTRA_BACKEND_IMAGE:-orchestra-backend:local}"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be supplied by the deployment environment}"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "prisma:migrate:deploy"]
    restart: "no"

volumes:
  db_data:
