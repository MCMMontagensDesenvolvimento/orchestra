services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_NAME: Orchestra
        VITE_APP_ENV: production
        VITE_API_BASE_URL: /api/v1
        VITE_USE_MOCKS: "false"
        VITE_MOCK_DELAY_MS: "0"
        VITE_MOCK_SCENARIO: success
    env_file:
      - path: ./frontend/.env.example
      - path: ./frontend/.env
        required: false
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      LOG_LEVEL: info
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
