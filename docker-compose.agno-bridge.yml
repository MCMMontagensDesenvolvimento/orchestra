services:
  backend:
    environment:
      AGNO_RUNTIME_HTTP_BASE_URL: http://agno-bridge:8091
    depends_on:
      agno-bridge:
        condition: service_healthy

  agno-bridge:
    build:
      context: ./runtime/agno-bridge
      dockerfile: Dockerfile
    env_file:
      - path: ./runtime/agno-bridge/.env.example
      - path: ./runtime/agno-bridge/.env
        required: false
    environment:
      AGNO_RUNTIME_HTTP_HOST: 0.0.0.0
      AGNO_RUNTIME_HTTP_PORT: "8091"
      ORCHESTRA_TOOL_GATEWAY_URL: http://backend:3000/api/v1/runtime/agno/tool-calls
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

